server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: water-repair-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/ccdev?reWriteBatchedInserts=true}
    username: ${DB_USER:ccdev}
    password: ${DB_PASSWORD:ccdev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-flat-param-object: true

app:
  security:
    token-ttl-hours: 12
  pressure:
    # 采样时刻与回执时刻允许的校时后偏差（秒），支管未单独配置时使用
    default-time-tolerance-seconds: 600
  seed:
    enabled: ${SEED_ENABLED:true}

logging:
  level:
    com.waterrepair: INFO
    org.hibernate.SQL: WARN
